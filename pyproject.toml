[project]
name = "mlops-final-project-petrov-alexander"
version = "0.1.0"
description = "Сервис оценки вероятности покупки товара: подготовка данных, обучение CatBoost, FastAPI-инференс, мониторинг"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0",
    "catboost>=1.2.8",
    "fastapi>=0.115.12",
    "joblib>=1.4.2",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "prometheus-client>=0.21.1",
    "pyarrow>=18.1.0",
    "scikit-learn>=1.6.1",
    "uvicorn[standard]>=0.34.2",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--tb=short -q"
testpaths = ["tests"]
pythonpath = ["."]
