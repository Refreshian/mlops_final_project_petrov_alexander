---
# CI/CD финального проекта: проверки кода, тесты, сборка образа и выкатка сервиса.
#
# Переменные задаются в Settings -> CI/CD -> Variables. Секреты помечены как Masked:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY   — ключи доступа к S3
#   VM_HOST, VM_USER, SSH_PRIVATE_KEY          — доступ к виртуалке для выкатки
#   GRAFANA_ADMIN_PASSWORD                     — пароль Grafana на виртуалке
# CI_REGISTRY, CI_REGISTRY_IMAGE, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD
# и CI_COMMIT_SHORT_SHA GitLab подставляет сам.

stages:
  - lint
  - formating
  - test
  - build
  - save
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  DOCKER_BUILDKIT: "1"

default:
  image: python:3.12-slim
  cache:
    key:
      files:
        - requirements.txt
        - requirements-dev.txt
    paths:
      - .cache/pip

# Общая подготовка Python-джобов
.python-setup:
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements-dev.txt

# ---------------------------------------------------------------------------
# Проверка стиля и типов
# ---------------------------------------------------------------------------
lint-ruff:
  stage: lint
  extends: .python-setup
  script:
    - ruff check .
    - mypy

# ---------------------------------------------------------------------------
# Проверка форматирования
# ---------------------------------------------------------------------------
format-black:
  stage: formating
  extends: .python-setup
  script:
    - black --check .

# ---------------------------------------------------------------------------
# Unit-тесты сервиса
# ---------------------------------------------------------------------------
test-pytest:
  stage: test
  extends: .python-setup
  script:
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml

# ---------------------------------------------------------------------------
# Сборка образа (buildkit) и выгрузка в GitLab Container Registry
# ---------------------------------------------------------------------------
.docker-setup:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # buildkit-сборщик с кэшем в реестре проекта
    - docker buildx create --use --driver docker-container --name builder
    - docker buildx inspect --bootstrap

build-image:
  stage: build
  extends: .docker-setup
  script:
    # Собираем без выгрузки: проверяем Dockerfile и прогреваем кэш
    - >-
      docker buildx build
      --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:cache
      --cache-to type=registry,ref=$CI_REGISTRY_IMAGE:cache,mode=max
      -t "$IMAGE" .

save-image:
  stage: save
  extends: .docker-setup
  script:
    - >-
      docker buildx build
      --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:cache
      --push
      -t "$IMAGE" -t "$CI_REGISTRY_IMAGE:latest" .
    - echo "Образ выгружен в $IMAGE"

# ---------------------------------------------------------------------------
# Выкатка на виртуалку: синхронизируем репозиторий, перезапускаем контейнер
# ---------------------------------------------------------------------------
deploy-service:
  stage: deploy
  image: alpine:3.20
  needs:
    - save-image
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: http://$VM_HOST:8000/docs
  before_script:
    - apk add --no-cache openssh-client rsync curl
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - rsync -az --delete --exclude .git --exclude .venv --exclude data --exclude artifacts
      ./ "$VM_USER@$VM_HOST:~/mlops_final_project_petrov_alexander/"
    # Секреты попадают на виртуалку только в .env, в репозитории их нет
    - |
      ssh "$VM_USER@$VM_HOST" "cat > ~/mlops_final_project_petrov_alexander/.env" <<EOF
      IMAGE=$IMAGE
      S3_BUCKET=$S3_BUCKET
      S3_PREFIX=$S3_PREFIX
      AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
      GRAFANA_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD
      EOF
    - >-
      ssh "$VM_USER@$VM_HOST"
      "cd ~/mlops_final_project_petrov_alexander &&
      CI_REGISTRY=$CI_REGISTRY CI_REGISTRY_USER=$CI_REGISTRY_USER
      CI_REGISTRY_PASSWORD=$CI_REGISTRY_PASSWORD bash scripts/deploy.sh"
    # Проверка эндпоинта из задания
    - >-
      curl -fsS
      "http://$VM_HOST:8000/predict_purchase?itemid=356475&hour=14&weekday=3"
